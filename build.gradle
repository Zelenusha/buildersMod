plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'io.github.zelenusha.buildersmod'
version = mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory project.file('run')
            mods {
                buildersmod { source sourceSets.main }
            }
        }
        client {
            // gradlew runClient -Pwalkthrough=main plays a scripted session and writes screenshots to run-walkthrough.
            if (project.hasProperty('walkthrough')) {
                workingDirectory project.file('run-walkthrough')
                property 'buildersmod.walkthrough', project.property('walkthrough')
                args '--width', '1280', '--height', '720'
                mods {
                    buildersmod { source sourceSets.gametest }
                }
            }
        }
        gameTestServer {
            workingDirectory project.file('run-tests')
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                buildersmod { source sourceSets.gametest }
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [mod_version: mod_version, forge_version: forge_version]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') {
        expand properties
    }
}

test {
    useJUnitPlatform()
}

if (project.hasProperty('walkthrough')) {
    // The scripted client must not stop on first-run screens or when its window loses focus.
    def runDir = file('run-walkthrough')
    runDir.mkdirs()
    new File(runDir, 'options.txt').text = ['version:3465', 'onboardAccessibility:false', 'pauseOnLostFocus:false',
            'tutorialStep:none', 'lang:ru_ru', 'guiScale:2', 'narrator:0', 'soundCategory_master:0.0',
            'realmsNotifications:false', 'renderDistance:10', 'fullscreen:false'].join('\n') + '\n'
}

jar.finalizedBy('reobfJar')

// Game tests build in the saved test world. Start each run from an empty one so earlier runs cannot crowd it.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst { delete file('run-tests/world') }
}
